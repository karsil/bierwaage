[agent]
  interval = "60s"
  flush_interval = "60s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  topics = ["bierwaage/data"]
  client_id = "telegraf-bierwaage-01"
  data_format = "json"
  json_string_fields = ["datetime_date", "datetime_time"]

[[outputs.http]]
  url = "http://ingest:8000/ingest"
  data_format = "json"
  method = "POST"
