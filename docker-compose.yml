services:
  traefik:
    image: traefik:v3.3
    ports:
      - "80:80"
      - "1883:1883"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.mqtt.address=:1883"

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.mqtt.rule=HostSNI(`${MQTT_HOST}`)"
      - "traefik.tcp.routers.mqtt.entrypoints=mqtt"
      - "traefik.tcp.services.mqtt.loadbalancer.server.port=1883"

  ingest:
    build: ./ingest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    environment:
      DB_PATH: ${DB_PATH}

  telegraf:
    image: telegraf:1.33
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      ingest:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ingest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/kirsche`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.middlewares.frontend-strip.stripprefix.prefixes=/kirsche"
      - "traefik.http.routers.frontend.middlewares=frontend-strip"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    # dns_opt forces sequential A/AAAA DNS lookups instead of parallel.
    # Go's resolver (used by the Infinity plugin backend) triggers SERVFAIL from
    # Docker's embedded DNS (127.0.0.11) when both record types are queried at once,
    # making internal hostnames like "ingest" unresolvable despite being on the same network.
    dns_opt:
      - single-request
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - ingest
